name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node apps/cli/dist/index.js
      - name: Validate Windows helper scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($helperFile in @('scripts/verify-windows.ps1', 'scripts/inventory-windows-harnesses.ps1')) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $helperFile), [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'lam-harness-inventory.json'
          & ./scripts/inventory-windows-harnesses.ps1 -OutputPath $reportPath
          Get-Content -Raw -Encoding UTF8 $reportPath | ConvertFrom-Json | Out-Null
