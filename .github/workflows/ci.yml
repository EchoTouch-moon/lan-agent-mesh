name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: node apps/cli/dist/index.js
      - run: node scripts/check-rpc-probe.mjs
      - run: node scripts/check-windows-evidence-probes.mjs
      - name: Validate Windows helper scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          foreach ($helperFile in (Get-ChildItem scripts/*.ps1)) {
            $parseTokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($helperFile.FullName, [ref]$parseTokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          $reportPath = Join-Path $env:RUNNER_TEMP 'lam-harness-inventory.json'
          & ./scripts/inventory-windows-harnesses.ps1 -OutputPath $reportPath
          Get-Content -Raw -Encoding UTF8 $reportPath | ConvertFrom-Json | Out-Null
          $layoutRoot = Join-Path $env:RUNNER_TEMP 'LAM layout fixture'
          $glmRoot = Join-Path $layoutRoot 'resources/glm'
          New-Item -ItemType Directory -Path $glmRoot -Force | Out-Null
          $entryPath = Join-Path $glmRoot 'zcode.cjs'
          Set-Content -LiteralPath $entryPath -Value 'throw new Error("Static fixture must never execute");' -Encoding UTF8
          $layoutReport = Join-Path $env:RUNNER_TEMP 'lam-harness-layout.json'
          & ./scripts/inspect-windows-harness-layout.ps1 -ApplicationRoot $layoutRoot -OutputPath $layoutReport
          $layout = Get-Content -Raw -Encoding UTF8 $layoutReport | ConvertFrom-Json
          $fixture = @($layout.installations | Where-Object { $_.root -eq $layoutRoot })
          if ($fixture.Count -ne 1) { throw 'Explicit application root was not inspected.' }
          $entry = @($fixture[0].files | Where-Object { $_.relativePath -eq 'resources\glm\zcode.cjs' })
          if ($entry.Count -ne 1 -or $entry[0].sha256 -ne (Get-FileHash $entryPath -Algorithm SHA256).Hash.ToLowerInvariant()) {
            throw 'Bundled CLI metadata did not match the static fixture.'
          }
      - name: Validate Windows native probe launcher
        if: runner.os == 'Windows'
        run: node scripts/check-windows-probe-runner.mjs
      - name: Validate DSH desktop cmd launcher
        if: runner.os == 'Windows'
        run: node scripts/check-dsh-desktop-launcher.mjs
